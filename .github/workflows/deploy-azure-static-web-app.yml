name: Deploy frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-azure-static-web-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
        run: |
          if [[ -z "$REACT_APP_API_BASE_URL" ]]; then
            echo "::error::Set the GitHub Actions variable REACT_APP_API_BASE_URL."
            exit 1
          fi

          if [[ "$REACT_APP_API_BASE_URL" != https://* ]]; then
            echo "::error::REACT_APP_API_BASE_URL must use HTTPS."
            exit 1
          fi

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /app
          api_location: ""
          output_location: build
          app_build_command: npm run build
        env:
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
